---
- name: Delete GCP Instances
  hosts: localhost
  become: true
  vars_files:
    - ../vars/config.yaml
  tasks:
    - name: Delete master instances
      google.cloud.gcp_compute_instance:
        name: "{{ item.name }}"
        machine_type: "{{ item.machine_type }}"
        zone: "{{ item.zone }}"
        project: "{{ google_project_id }}"
        auth_kind: application
        state: absent
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64"
              disk_size_gb: "{{ item.disk_size }}"
              disk_type: "{{ item.disk_type }}"
        network_interfaces:
          - network:
              selfLink: "projects/{{ google_project_id }}/global/networks/default"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        tags:
          items:
            - http-server
            - https-server
      loop: "{{ masters }}"
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
        GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"

    - name: Delete worker instances
      google.cloud.gcp_compute_instance:
        name: "{{ item.name }}"
        machine_type: "{{ item.machine_type }}"
        zone: "{{ item.zone }}"
        project: "{{ google_project_id }}"
        auth_kind: application
        state: absent
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64"
              disk_size_gb: "{{ item.disk_size }}"
              disk_type: "{{ item.disk_type }}"
        network_interfaces:
          - network:
              selfLink: "projects/{{ google_project_id }}/global/networks/default"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        tags:
          items:
            - http-server
            - https-server
      loop: "{{ workers }}"
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
        GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"

    - name: Clean up inventory file - remove masters
      lineinfile:
        path: ../inventory.ini
        regexp: '^master\d+\s+ansible_host='
        state: absent

    - name: Clean up inventory file - remove workers
      lineinfile:
        path: ../inventory.ini
        regexp: '^worker\d+\s+ansible_host='
        state: absent

    - name: Display deletion status
      debug:
        msg: "All instances have been deleted and inventory cleaned"
